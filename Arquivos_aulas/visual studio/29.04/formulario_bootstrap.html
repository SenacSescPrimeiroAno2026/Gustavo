<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade formulario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container d-flex justify-content-center">
        <div class="w-40 p-3 bg-light">
            <form action="">
                <H1>Inicio do formulario</H1>
                <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
                    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"></script>
                <div class="form-group">
                    <label for="NomeID">Nome completo:</label>
                    <input type="text" class="form-control" id="NomeID">
                </div>
                <div class="form-group">
                    <label for="IdadeID">Idade</label>
                    <input type="number" class="form-control" id="IdadeID">
                </div>
                <div class="form-group">
                    <label for="DataID">Data de nascimento</label>
                    <input type="text" class="form-control" id="DataID">
                </div>
                <div class="form-group">
                    <label for="TeleID">Telefone</label>
                    <input type="number" class="form-control" id="TeleID">
                </div>
                <div>
                    <label for="EmailID">Email</label>
                    <input type="email" class="form-control" id="EmailID">
                </div>
                <br>
                <div class="form-check">
                    <p>Turnos:</p>
                    <input class="form-check-input" type="radio" name="Turno" id="ManhãID" value="option1">
                    <label for="ManhãID">Manhã</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="Turno" id="TardeID" value="option1">
                    <label for="TardeID">Tarde</label>
                </div><div class="form-check">
                    <input class="form-check-input" type="radio" name="Turno" id="NoiteID" value="option1">
                    <label for="NoiteID">Noite</label>
                </div>
                <br><br>
                
            </form>
        </div>

    </div>
</body>

</html>
