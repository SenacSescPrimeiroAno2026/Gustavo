<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="Formulário">
            <h1>Formulários HTML</h1>

            <form action="recebe.html" method="post">
                <!-- Action é o atributo que define para onde os dados serão enviado, quando o botão do formulario for clicado. Os metodos de envio são GET e POST, o metodo GET é usado para enviar dados através da URL, enquanto o metodo post é usado para enviar dados atraves do corpo da requisição HTTP. O metodo padrão é GET, esses métodos são utilizados junto  da linguagem de programação do lado do servidor, como JavaScript, PHP, Python, etc.-->
                <label for="ID_nome">
                    <!-- Label é o elemento que fica acima do input, o label define o que deve ser escrito no input-->
                    Nome:
                </label>
                <br>
                <input type="text" id="ID_nome" name="lnome" value=""> <!-- input é onde os dados serão digitados-->
                <br>
                <br>
                <label for="ID_senha">
                    <!-- o for é usado para direcionar ao elemento input, ou seja, quando eu clicar no label senha, eu vou para o campo de digitação da senha-->
                    Senha:
                </label>
                <br>
                <input type="password" id="ID_senha" name="lsenha" value="">
                <!-- type é o tipo de dados que vai ser digitado no campo input, id é o identificador do campo, name é o nome do campo, value é o valor do campo-->
                <br>
                <br>
                <input type="submit" value="enviar">
                <!-- o type submit é um botão que envia os dados do formulario para o servidor-->
            </form>
            <form action="">

                <p>Escolha sua cor favorita.</p>
                <input type="radio" id="azul" name="cor" value="azul">
                <!-- o type radio é usado para criar opções de escolha, o atributuo name define define os grupos de opções, ou seja, as opções que possuem o mesmo nome fazem parte do mesmo grupo, e apenas uma opção pode ser selecionada dentro do grupo-->
                <label for="azul">Azul</label>
                <br>
                <input type="radio" id="vermelho" name="cor" value="vermelho">
                <label for="vermelho">Vermelho</label>
                <br>
                <input type="radio" id="verde" name="cor" value="verde">
                <label for="verde">Verde</label>
            </form>
            <br>
            <br>
            <form action="">
                <p>Escolha o seu esporte favorito.</p>
                <input type="checkbox" id="esporte1" name="esporte1" value="futebol"> <!-- o type checkbox é usado para criar opções de escolha assim como o radio, a doferença é que o checkbox permite selecionar mais de uma opção ao mesmo tempo-->
                <label for="esporte1">futebol</label>
                <input type="checkbox" id="esporte2" name="esporte2" value="volei">
                <label for="esporte12">volei</label>
                <input type="checkbox" id="esporte3" name="esporte3" value="Ciclismo">
                <label for="esporte3">ciclismo</label>
            </form>
        </div>
    </div>
</body>

</html>
